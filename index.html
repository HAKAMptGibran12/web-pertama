<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H4KM PROFIL</title>

<link rel="stylesheet" href="style.css">
</head>
<body>
    
<!-- LOADING SCREEN -->
<div id="loader">
    <div class="spinner"></div>
    <p>Loading...</p>
</div>

<!-- NAVBAR -->
<nav>
    <h2>ALFATH</h2>
    <div>
        <a href="#profil">Profil</a>
        <a href="#skill">Skill</a>
        <a href="#galeri">Galeri</a>
        <a href="#kontak">Kontak</a>
    </div>
</nav>

<!-- HERO -->
<section class="hero">
    <h1>PROFIL <span>ALFATH</span></h1>
    <p id="typing"></p>
</section>

<!-- PROFIL -->
<section id="profil" class="profil">
    <h2>My Profil</h2>
    
    <img src="Gibran.jpg.avif" alt="Foto Profil">
    
    <p>Nama: Alfath</p>
    <p>Kelas: XI RPL</p>
    <p>Jurusan: RPL</p>
</section>

<!-- SKILL -->
<section id="skill" class="skill">
    <h2>My Skill</h2>

    <div class="skill-bar">
        <p>HTML</p>
        <div class="bar"><div class="fill" data-width="75%">75%</div></div>

        <p>CSS</p>
        <div class="bar"><div class="fill" data-width="70%">70%</div></div>

        <p>JavaScript</p>
        <div class="bar"><div class="fill" data-width="50%">50%</div></div>

        <p>C++</p>
        <div class="bar"><div class="fill" data-width="80%">80%</div></div>
    </div>
</section>

<!-- GALERI -->
<section id="galeri" class="galeri">
    <h2>Galeri</h2>
    <div class="grid">
        <img src="Gibran2.jpg">
        <img src="Gibran3.jpg">
        <img src="Gibran4.jpg">
    </div>
</section>

<!-- KONTAK -->
<section id="kontak">
    <h2 style="text-align:center;">Kontak Saya</h2>
    <form>
        <input placeholder="Nama">
        <input placeholder="Email">
        <textarea placeholder="Pesan"></textarea>
        <button>Kirim</button>
    </form>
</section>

<footer>
<p>© <span id="year"></span> Alfath</p>
</footer>

<script src="script.js"></script>
</body>
</html>
